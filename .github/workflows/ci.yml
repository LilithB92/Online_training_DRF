name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install flake8уу
        run: |
          python -m pip install --upgrade pip
          pip install flake8 

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY}}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY}}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Login in Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN}} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME}} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{secrets.DOCKER_HUB_USERNAME}}/Online_training_DRF:${{ github.sha}} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/Online_training_DRF:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/Online_training_DRF:${{ github.sha }}
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name app -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/Online_training_DRF:${{ github.sha }}
          EOF
